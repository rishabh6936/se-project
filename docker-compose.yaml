version: '3.8'

services:
  # FastAPI Application
  fastapi-app:
    build:
      context: ./App
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://admin:password123@mongodb:27017/microservice_db?authSource=admin
      - REDIS_QUEUE_URL=redis://redis-queue:6379
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - REDIS_LIMITER_URL=redis://redis-limiter:6379
    # --- CORRECTED depends_on SYNTAX ---
    depends_on:
      mongodb:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-limiter:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservice-network

  # AI Processing Worker
  ai-worker:
    build:
      context: ./AI
      dockerfile: Dockerfile
    environment:
      - MONGODB_URL=mongodb://admin:password123@mongodb:27017/microservice_db?authSource=admin
      - REDIS_QUEUE_URL=redis://redis-queue:6379
      - REDIS_LIMITER_URL=redis://redis-limiter:6379 # The worker needs this
    # --- CORRECTED depends_on SYNTAX ---
    depends_on:
      mongodb:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-limiter:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservice-network
    deploy:
      replicas: 3

  # Redis Queue for async processing
  redis-queue:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-queue-data:/data
    restart: unless-stopped
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for high-performance caching
  redis-cache:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data
    restart: unless-stopped
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Rate Limiter for protecting downstream services
  redis-limiter:
    image: redis:7.2-alpine
    ports:
      - "6381:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-limiter-data:/data
    restart: unless-stopped
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for primary data storage
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost", "--username", "admin", "--password", "password123", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  microservice-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-queue-data:
  redis-cache-data:
  redis-limiter-data: