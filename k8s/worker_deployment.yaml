apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-creation-worker
  labels:
    app: text-creation-worker
spec:
  replicas: 1 # Start with one replica. KEDA will manage this number.
  selector:
    matchLabels:
      app: text-creation-worker
  template:
    metadata:
      labels:
        app: text-creation-worker
    spec:
      containers:
      - name: worker
        image: your-repo/your-worker-image:latest # <-- CHANGE THIS
        # This command runs your worker script instead of the FastAPI app
        command: ["python", "your_project_folder/worker.py"] 
        env:
        - name: MONGODB_URL
          value: "mongodb://mongo-service:27017" # Use Kubernetes service names
        - name: REDIS_URL
          value: "redis://redis-service:6379/1"